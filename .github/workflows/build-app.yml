# Builds "FOT App" for Windows, macOS and Linux with FOT_App/_internal/app_src/build_app.py.
#
# Runs when FOT_App changes on main, or by hand (Actions tab -> Build FOT App -> Run
# workflow). Each run's zips are under the run's "Artifacts" for 30 days. Pushing a
# version tag (e.g. git tag v1.2 && git push origin v1.2) also attaches the three
# zips to a GitHub Release, which keeps them permanently.
#
# The zips hold the app and its code only: no patient database, recordings or
# device calibration (build_app.py leaves out system.db and app_src/data).
name: Build FOT App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "FOT_App/**"
      - ".github/workflows/build-app.yml"
  # Also on pull requests, so a change is built on all three systems before merging.
  pull_request:
    paths:
      - "FOT_App/**"
      - ".github/workflows/build-app.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 rather than 3.14: pythonnet, which pywebview uses on Windows, has
          # ready-built packages for it.
          python-version: "3.13"

      - name: Linux libraries for the Qt web viewer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxshmfence1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libasound2

      - name: Run the app's tests
        working-directory: FOT_App/_internal/app_src
        run: |
          python -m pip install --only-binary=:all: --no-binary=proxy-tools -r requirements.txt pytest
          python -m pytest tests -q

      - name: Build and package
        run: python FOT_App/_internal/app_src/build_app.py --package

      - uses: actions/upload-artifact@v4
        with:
          name: FOT_App-${{ matrix.label }}
          path: FOT_App/.build/FOT_App-${{ matrix.label }}.zip
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
