# On every push and pull request that touches FOT_App: runs the app's tests on
# Windows, macOS and Linux.
#
# Packaged apps (build_app.py) are NOT built automatically: the team runs the app
# from source with the "Start FOT App" scripts for now. To build them, start this
# workflow by hand (Actions tab -> Build FOT App -> Run workflow); the zips appear
# under that run's "Artifacts" for 30 days. A version tag (git tag v1.2 && git push
# origin v1.2) also builds them and attaches them to a GitHub Release.
#
# The zips hold the app and its code only: no patient database, recordings or
# device calibration (build_app.py leaves out system.db and app_src/data).
name: Build FOT App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "FOT_App/**"
      - ".github/workflows/build-app.yml"
  # Also on pull requests, so a change is built on all three systems before merging.
  pull_request:
    paths:
      - "FOT_App/**"
      - ".github/workflows/build-app.yml"

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The same command the Start FOT App scripts use, so this also checks that
      # requirements.txt installs on every system.
      - name: Run the app's tests
        working-directory: FOT_App/_internal/app_src
        run: uv run --no-project --python 3.13 --with-requirements requirements.txt --with pytest python -m pytest tests -q

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 rather than 3.14: pythonnet, which pywebview uses on Windows, has
          # ready-built packages for it.
          python-version: "3.13"

      - name: Linux libraries for the Qt web viewer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxshmfence1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libasound2

      - name: Build and package
        run: python FOT_App/_internal/app_src/build_app.py --package

      - uses: actions/upload-artifact@v4
        with:
          name: FOT_App-${{ matrix.label }}
          path: FOT_App/.build/FOT_App-${{ matrix.label }}.zip
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
